                        <!-- =================================================
                     PRODUCTS
                     ================================================= -->

                        <!-- =====================================================
     PRODUCTS
     ===================================================== -->

<div id="itemsInOrder" class="product-box-extra">
    <!-- Product rows will be added here by JavaScript -->
</div>


                        <!-- =================================================
                     ORDER TOTAL
                     ================================================= -->

                        <section id="orderSummary" class="dashboard-card order-summary-card">

                                <div class="summary-label">
                                    <span> Grand Total </span>
                                </div>

                                <div class="summary-value">
                                    <div class="grand-total-wrapper">
                                        <span class="currency-symbol"> ₹ </span>

                                        <input
                                            id="product_grand_total"
                                            name="product_grand_total"
                                            class="product-grand-total"
                                            value="0.0"
                                            readonly
                                        />
                                    </div>

                                    <button class="save-order-btn" type="button" id="saveOrder">

                    <!-- =====================================================
                 HIDDEN PRODUCT TEMPLATE
                 order.js uses this template
                 ===================================================== -->

                    <!-- =====================================================
     HIDDEN PRODUCT TEMPLATE
     ===================================================== -->

<div id="productTemplate" class="product-template" style="display: none;">

    <div class="order-product-row">

        <!-- PRODUCT -->
        <div class="order-product-field product-column">

            <label class="mobile-product-label">
                Product
            </label>

            <select
                name="product"
                class="form-control cart-product">
            </select>

        </div>


        <!-- PRICE -->
        <div class="order-product-field price-column">

            <label class="mobile-product-label">
                Price
            </label>

            <div class="price-field">

                <span>₹</span>

                <input
                    name="product_price"
                    class="product-price"
                    value="0.0"
                    readonly
                >

            </div>

        </div>


        <!-- QUANTITY -->
        <div class="order-product-field quantity-column">

            <label class="mobile-product-label">
                Quantity
            </label>

            <input
                name="qty"
                type="number"
                min="1"
                class="form-control product-qty"
                value="1"
            >

        </div>


        <!-- TOTAL -->
        <div class="order-product-field total-column">

            <label class="mobile-product-label">
                Total
            </label>

            <div class="item-total-wrapper">

                <input
                    name="item_total"
                    class="product-total"
                    value="0.0"
                    readonly
                >

                <span>₹</span>

                <button
                    class="remove-row"
                    type="button">

                    <i class="zmdi zmdi-delete"></i>

                    Remove

                </button>

            </div>

        </div>

    </div>

</div>
                </div>
            </main>

        <!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

        <script src="js/packages/jquery.min.js"></script>

        <script src="js/packages/bootstrap.min.js"></script>

        <script src="js/custom/common.js"></script>

        <script src="js/custom/order.js"></script>

        <!-- =====================================================
     SIDEBAR JAVASCRIPT
     ===================================================== -->

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const menuButton = document.getElementById("menuButton");

                const sidebar = document.getElementById("gsmsSidebar");

                const overlay = document.getElementById("sidebarOverlay");

                if (!menuButton || !sidebar || !overlay) {
                    console.error("Sidebar elements not found!");

                    return;
                }

                /* Open / Close Sidebar */

                menuButton.addEventListener("click", function () {
                    sidebar.classList.toggle("open");

                    overlay.classList.toggle("open");
                });

                /* Close Sidebar */

                overlay.addEventListener("click", function () {
                    sidebar.classList.remove("open");

                    overlay.classList.remove("open");
                });

                /* Close after menu click */

                const sidebarLinks = document.querySelectorAll(".sidebar-link");

                sidebarLinks.forEach(function (link) {
                    link.addEventListener("click", function () {
                        sidebar.classList.remove("open");

                        overlay.classList.remove("open");
                    });
                });
            });
        </script>
    </body>
